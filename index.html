<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LayerSync AI | Synchronize Intelligence</title>
    <meta name="description" content="LayerSync AI layers artificial intelligence into your business operations — automating what's manual, scaling what's human, and building what's next.">

    <!-- Favicons & brand icons -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#D36135">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050505">

    <!-- Social sharing -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="LayerSync AI | Synchronized Intelligence">
    <meta property="og:description" content="We layer AI into your business operations — automating what's manual, scaling what's human, and building what's next.">
    <meta property="og:image" content="/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="LayerSync AI | Synchronized Intelligence">
    <meta name="twitter:image" content="/og-image.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Brand tokens for the Tailwind Play CDN (runtime JIT)
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: { light: '#E5946B', DEFAULT: '#D36135', dark: '#B14A24' },
                            green: { light: '#9CC489', DEFAULT: '#7FB069', dark: '#5E8E49' },
                            amber: { light: '#C0A36A', DEFAULT: '#A9884F', dark: '#8A6E3C' },
                        },
                    },
                },
            },
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --bg-light: #f5f5f7;
            /* ===== New brand palette ===== */
            --brand-orange: #D36135;
            --brand-orange-light: #E5946B;
            --brand-orange-dark: #B14A24;
            --brand-green: #7FB069;
            --brand-green-light: #9CC489;
            --brand-green-dark: #5E8E49;
            --brand-amber: #A9884F;
            --brand-amber-light: #C0A36A;
            --brand-amber-dark: #8A6E3C;
            --brand-gradient: linear-gradient(135deg, #D36135 0%, #7FB069 100%);
        }

        * {
            cursor: default;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            background-color: #050505;
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }


        .text-shimmer {
            background: linear-gradient(to right,
                    rgba(0, 0, 0, 0.3) 0%,
                    rgba(0, 0, 0, 0.9) 50%,
                    rgba(0, 0, 0, 0.3) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 12s infinite linear;
        }

        .dark .text-shimmer {
            background: linear-gradient(to right,
                    rgba(255, 255, 255, 0.4) 0%,
                    rgba(255, 255, 255, 1) 50%,
                    rgba(255, 255, 255, 0.4) 100%);
            -webkit-background-clip: text;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        .glass-card {
            background: rgba(0, 0, 0, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 400ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dark .glass-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hero-heading {
            font-size: clamp(2.25rem, 6vw, 6rem);
            line-height: 1.1;
            letter-spacing: -0.04em;
            font-weight: 300;
        }

        .sub-heading {
            font-size: clamp(1rem, 2vw, 1.25rem);
            letter-spacing: -0.01em;
            font-weight: 300;
            opacity: 0.7;
            line-height: 1.6;
        }

        .nav-scrolled {
            background: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(20px) !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            padding-top: 1rem !important;
            padding-bottom: 1rem !important;
        }

        .dark .nav-scrolled {
            background: rgba(5, 5, 5, 0.8) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(211, 97, 53, 0.35);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ===== Global Button Hover ===== */
        button,
        a[class*="btn"],
        a[class*="rounded-full"] {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        button:hover,
        a[class*="btn"]:hover,
        a[class*="rounded-full"]:hover {
            transform: translateY(-1px);
        }

        button:active,
        a[class*="btn"]:active,
        a[class*="rounded-full"]:active {
            transform: translateY(0px) scale(0.98);
        }

        /* ===== Button Shimmer / Glow ===== */
        .btn-glow {
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-glow::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.15) 40%,
                    rgba(255, 255, 255, 0.3) 50%,
                    rgba(255, 255, 255, 0.15) 60%,
                    transparent 100%);
            animation: btn-shimmer 3s ease-in-out infinite;
            pointer-events: none;
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow:
                0 0 20px rgba(211, 97, 53, 0.30),
                0 0 60px rgba(127, 176, 105, 0.18),
                0 10px 40px rgba(0, 0, 0, 0.3);
        }

        @keyframes btn-shimmer {
            0% {
                left: -100%;
            }

            50% {
                left: 100%;
            }

            100% {
                left: 100%;
            }
        }

        /* ===== Gradient Animation ===== */
        @keyframes gradient-x {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .animate-gradient-x {
            background-size: 200% 200%;
            animation: gradient-x 4s ease infinite;
        }

        /* ===== Ambient Glow ===== */
        .ambient-glow {
            animation: pulse-glow 6s ease-in-out infinite alternate;
        }

        @keyframes pulse-glow {
            0% {
                opacity: 0.3;
            }

            100% {
                opacity: 0.7;
            }
        }

        /* ===== Card Hover Glow ===== */
        .card-hover-glow {
            position: relative;
            overflow: hidden;
        }

        .card-hover-glow::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(211, 97, 53, 0.06) 0%, transparent 50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .card-hover-glow:hover::after {
            opacity: 1;
        }

        /* ===== Float Animation ===== */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>

<body class="bg-[#050505]">
    <div class="noise-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
